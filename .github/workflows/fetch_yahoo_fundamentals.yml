name: Fetch Yahoo fundamentals

# Income-statement data for the money-flow watchlists' tickers. The research container
# cannot reach Yahoo (egress proxy), so the runner pulls it and commits it back.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fundamentals:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install --quiet "yfinance>=0.2.50" pandas
      - name: Download income statements
        run: python3 scripts/fetch_yahoo_fundamentals.py
      - name: Commit fundamentals
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/yahoo
          git commit -m "data: Yahoo income-statement fundamentals for the watchlist universe" || { echo "nothing to commit"; exit 0; }
          git pull --rebase --quiet origin "${GITHUB_REF_NAME}"
          git push
